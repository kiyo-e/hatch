# 閉じた PR のプレビューの取り残しを、毎日片付ける（アプリ側のリポジトリに置く例）。
# PR を閉じたときのジョブが失敗した場合や、hatch の自動破棄（放置 14 日など）・管理画面からの破棄で、
# DB や MicroVM イメージが残ったものを拾う。何度実行しても同じ結果になる。
name: Sweep PR Previews

on:
  schedule:
    - cron: "0 18 * * *" # 毎日 03:00 JST
  workflow_dispatch:

concurrency:
  group: preview-sweep
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  sweep:
    runs-on: ubuntu-24.04-arm
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      GH_TOKEN: ${{ github.token }}
      CI_WEBHOOK_SECRET: ${{ secrets.CI_WEBHOOK_SECRET }}
      API_BASE_URL: ${{ vars.HATCH_API_BASE_URL }}
      DATABASE_URL_BASE: ${{ secrets.PREVIEW_DATABASE_URL_BASE }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PREVIEW_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sweep previews of closed PRs
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          # PR ごとに状態を確かめる。閉じている（CLOSED / MERGED）と確かめられたものだけを片付け、
          # 開いているものや、状態を取れなかったもの（削除された PR など）は残す
          is_closed() {
            case "$(gh pr view "$1" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null)" in
              CLOSED | MERGED) return 0 ;;
              *) return 1 ;;
            esac
          }

          # 1. PR 用のデータベース
          dbs="$(psql "${DATABASE_URL_BASE}/postgres" -Atc "SELECT datname FROM pg_database WHERE datname ~ '^preview_pr_[0-9]+$'")"
          # 2. MicroVM イメージ
          # 一覧の取得に失敗したらジョブを失敗にする（該当なしだけを許す）
          all_images="$(aws lambda-microvms list-microvm-images --query 'items[].name' --output text)"
          images="$(tr '\t' '\n' <<<"$all_images" | grep -E '^preview-pr-[0-9]+$' || true)"

          failed=0
          numbers="$( { sed -n 's/^preview_pr_//p' <<<"$dbs"; sed -n 's/^preview-pr-//p' <<<"$images"; } | sort -un)"
          for n in $numbers; do
            is_closed "$n" || continue
            echo "sweeping PR #${n}"
            # hatch の破棄は何度呼んでもよい（登録が無ければ何もしない）。失敗したらこの PR は残し、
            # 次回の sweep で再試行する（イメージと DB を消すと、次回この PR を見つけられなくなるため）
            if ! curl --fail-with-body -sS -o /dev/null -X DELETE \
              "${API_BASE_URL}/api/envs/pr-${n}/destroy" -H "X-CI-Secret: ${CI_WEBHOOK_SECRET}"; then
              echo "  ::warning::hatch destroy failed for pr-${n}; will retry next time"
              continue
            fi
            if grep -qx "preview-pr-${n}" <<<"$images"; then
              account="$(aws sts get-caller-identity --query Account --output text)"
              aws lambda-microvms delete-microvm-image \
                --image-identifier "arn:aws:lambda:${AWS_REGION}:${account}:microvm-image:preview-pr-${n}" >/dev/null \
                && echo "  deleted MicroVM image" || echo "  ::warning::could not delete MicroVM image preview-pr-${n}"
            fi
            if grep -qx "preview_pr_${n}" <<<"$dbs"; then
              if psql "${DATABASE_URL_BASE}/postgres" -v ON_ERROR_STOP=1 \
                -c "DROP DATABASE IF EXISTS \"preview_pr_${n}\" WITH (FORCE)" >/dev/null; then
                echo "  dropped database"
              else
                echo "  ::error::could not drop database preview_pr_${n}"
                failed=1
              fi
            fi
          done
          # DB を消せなかったものがあれば、ほかの PR を片付けたあとでジョブを失敗にする
          exit "$failed"
